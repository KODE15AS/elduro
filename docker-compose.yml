name: elduro

services:
  # Elduro web UI + data hub on Tailscale: http://<raven>:8094/
  # HTTPS (needed for Web Bluetooth) via: tailscale serve --bg --https=8443 http://127.0.0.1:8094
  web:
    build: .
    image: elduro/web:latest
    user: "1000:1000"
    ports:
      - "8094:8080"
    volumes:
      # Built agent binaries (e.g. the Windows exe for lane 2) are
      # downloadable at /dl/.
      - ./bin:/app/static/dl:ro
    environment:
      # MariaDB-ingest (kanonisk arkiv). Settes i .env (gitignorert) ved
      # provisjonering; tom verdi = ingest av. Se db/schema.sql og
      # docs/format/arkivkoding-vurdering.md. Databasen ligger i den delte
      # mariadb:11.4-containeren (dokumentert unntak, AGENTS.md) - web må da
      # også joines til dens docker-nett (gjøres ved provisjonering).
      ELDURO_DB_URL: ${ELDURO_DB_URL:-}
      ELDURO_SUBJECT_ID: ${ELDURO_SUBJECT_ID:-subject-1}
      # Beltelåsing for dual-H10 (per-enhet-arbitrering, 21.09.2026):
      # "kildemønster=belte-id", kommaseparert; '*' på slutten = prefiks-match.
      ELDURO_DEVICE_PINS: ${ELDURO_DEVICE_PINS:-}
      # Belteregister (23.09.2026): "bokstav=belte-id" - UI merker/sorterer
      # strimlene som BELTE A/B/C uansett transportvei.
      ELDURO_BELTS: ${ELDURO_BELTS:-}
    networks:
      default:
      # Delt MariaDB-stack (kanonisk arkiv) - se unntak nr. 2 i AGENTS.md.
      mariadb-nett:
      # web-gateway (felles ingress) når appen via dette nettet som
      # «elduro-web» — se KODE15AS/web-gateway.
      drengr-nett:
        aliases:
          - elduro-web
    restart: unless-stopped
    labels:
      raven.project: "e-elduro"

  # Felles-ingressen (Caddy) flyttet 2026-10-11 til egen drengr:
  # KODE15AS/web-gateway. elduro når den via drengr-nett (alias elduro-web).

networks:
  mariadb-nett:
    name: mariadb-nett
    external: true
  drengr-nett:
    name: drengr-nett
    external: true
