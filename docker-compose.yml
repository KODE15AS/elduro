name: elduro

services:
  # Elduro web UI + data hub on Tailscale: http://<raven>:8094/
  # HTTPS (needed for Web Bluetooth) via: tailscale serve --bg --https=8443 http://127.0.0.1:8094
  web:
    build: .
    image: elduro/web:latest
    user: "1000:1000"
    ports:
      - "8094:8080"
    volumes:
      # Built agent binaries (e.g. the Windows exe for lane 2) are
      # downloadable at /dl/.
      - ./bin:/app/static/dl:ro
    restart: unless-stopped
    labels:
      raven.project: "e-elduro"

  # Public HTTPS front door for elduro.no. Binds only raven's LAN IP
  # (10.5.0.22) because Tailscale already owns 100.65.19.39:443. The
  # FortiGate 1:1-NATs 62.92.43.149:80/443 -> 10.5.0.22, so Let's Encrypt
  # validation and normal traffic both reach Caddy here.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "10.5.0.22:80:80"
      - "10.5.0.22:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    labels:
      raven.project: "e-elduro"

volumes:
  caddy_data:
  caddy_config:
