name: elduro

services:
  # Elduro web UI + data hub on Tailscale: http://<raven>:8094/
  # HTTPS (needed for Web Bluetooth) via: tailscale serve --bg --https=8443 http://127.0.0.1:8094
  web:
    build: .
    image: elduro/web:latest
    user: "1000:1000"
    ports:
      - "8094:8080"
    volumes:
      # Built agent binaries (e.g. the Windows exe for lane 2) are
      # downloadable at /dl/.
      - ./bin:/app/static/dl:ro
    environment:
      # MariaDB-ingest (kanonisk arkiv). Settes i .env (gitignorert) ved
      # provisjonering; tom verdi = ingest av. Se db/schema.sql og
      # docs/format/arkivkoding-vurdering.md. Databasen ligger i den delte
      # mariadb:11.4-containeren (dokumentert unntak, AGENTS.md) - web må da
      # også joines til dens docker-nett (gjøres ved provisjonering).
      ELDURO_DB_URL: ${ELDURO_DB_URL:-}
      ELDURO_SUBJECT_ID: ${ELDURO_SUBJECT_ID:-subject-1}
      # Beltelåsing for dual-H10 (per-enhet-arbitrering, 21.09.2026):
      # "kildemønster=belte-id", kommaseparert; '*' på slutten = prefiks-match.
      ELDURO_DEVICE_PINS: ${ELDURO_DEVICE_PINS:-}
    networks:
      - default
      # Delt MariaDB-stack (kanonisk arkiv) - se unntak nr. 2 i AGENTS.md.
      - mariadb-nett
    restart: unless-stopped
    labels:
      raven.project: "e-elduro"

  # Public HTTPS front door for elduro.no AND studio15 (erbium.no).
  # Binds only raven's LAN IP (10.5.0.22) because Tailscale already owns
  # 100.65.19.39:443. The FortiGate 1:1-NATs 62.92.43.149:80/443 ->
  # 10.5.0.22, so Let's Encrypt validation and normal traffic both reach
  # Caddy here. Joined to the external "studio15" network to reach
  # kontroll-server:3200 (ingress router + on-demand TLS ask endpoint).
  caddy:
    image: caddy:2-alpine
    depends_on:
      - web
    ports:
      - "10.5.0.22:80:80"
      - "10.5.0.22:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/cadify/dev/studio15/landing:/srv/studio15-landing:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - studio15
      - wordpress-kode15
    restart: unless-stopped
    labels:
      raven.project: "e-elduro"

volumes:
  caddy_data:
  caddy_config:

networks:
  mariadb-nett:
    name: mariadb-nett
    external: true
  studio15:
    name: studio15
    external: true
  # WordPress for kode15 (repo KODE15AS/wordpress-kode15-no): Caddy naar
  # containeren wordpress-kode15-no paa dette nettet.
  wordpress-kode15:
    name: wordpress-kode15-no_default
    external: true
